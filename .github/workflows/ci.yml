name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      dep_refs:
        description: 依赖取哪个分支（空格分隔的 仓=分支），不写取各仓的默认分支。依赖的提交还没并进它的主分支时，先对着它验一遍
        default: ''
jobs:
  ip:
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      # 整片测试：ran asic 用 sv2v 与 yosys 展平出交付的 .v，测试台跑在 Verilator 上，程序用裸机的 RISC-V GCC 编；
      # Linux 镜像先在 QEMU 上过一遍
      apt: yosys verilator busybox-static gcc-riscv64-unknown-elf qemu-system-riscv
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      # 整片测试把 Linux 那一段的仿真器、镜像与脚本留给后面的接力
      keep: build/linux-run
  # Linux 起到 shell 要几个小时：四棒接力，每棒跑满四个半小时交断点，走完了余下的棒直接收工
  linux-1:
    needs: ip
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-boot
      restore: build/linux-run
      keep: build/linux-run
      stage: linux-1
  linux-2:
    needs: linux-1
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-boot
      restore: build/linux-run
      from: linux-1
      keep: build/linux-run
      stage: linux-2
  linux-3:
    needs: linux-2
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-boot
      restore: build/linux-run
      from: linux-2
      keep: build/linux-run
      stage: linux-3
  linux-4:
    needs: linux-3
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      apt: yosys verilator
      pip: pyyaml
      sv2v: v0.0.13
      dep-refs: ${{ inputs.dep_refs }}
      tasks: linux-boot
      restore: build/linux-run
      from: linux-3
      keep: build/linux-run
      stage: linux-4
